name: segger
channels:
  - rapidsai
  - conda-forge
  - nvidia
  - defaults
dependencies:
  # Python version
  - python>=3.10

  # Main dependencies from pyproject.toml
  - pytorch>=2.0.0
  - torchvision>=0.10.0
  - pytorch-lightning>=1.9.0
  - torchmetrics>=0.5.0
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - tqdm>=4.61.0
  - scanpy>=1.9.3
  - squidpy==1.2.0
  - adjusttext>=0.8
  - scikit-learn>=0.24.0
  - geopandas>=0.9.0
  - shapely>=1.7.0
  - path>=17.0.0
  - pyarrow>=17.0.0
  - dask-geopandas>=0.4.0
  - dask-cuda>=23.10.0
  - distributed>=2023.10.0

  # RAPIDS for CUDA 12
  - cudf-cu12==24.8.*
  - cuml-cu12==24.8.*
  - cugraph-cu12==24.8.*
  - cuspatial-cu12==24.8.*
  - cupy-cuda12x
  - nccl>=2.18
  - cutensor>=1.7

  # Optional dependencies
  - faiss-cpu>=1.7.0
  - faiss-gpu>=1.7.0

  # Development dependencies
  - pytest
  - black
  - flake8
  - pre-commit
  - twine>=4.0.2

  # Testing dependencies
  - coverage

  # Multiprocessing support
  - multiprocessing
