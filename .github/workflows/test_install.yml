name: Test Installation

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  install-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Package
        run: |
          python -m build

      - name: Install Package (from dist)
        run: |
          # Install the wheel with access to NVIDIA and PyTorch indexes
          # RAPIDS requires nvidia index; Torch 2.5.1+cu124 requires pytorch index (optional if pypi has it, but safer)
          pip install dist/*.whl \
            --extra-index-url https://pypi.nvidia.com \
            --extra-index-url https://download.pytorch.org/whl/cu124

      - name: Verify Import
        run: |
          python -c "import stereosegger; print(f'Successfully imported stereosegger version {stereosegger.__version__}')"

      - name: Verify CLI
        run: |
          stereosegger --help
