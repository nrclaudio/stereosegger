name: Sync from Public Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Public Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Add the public repo as upstream
          git remote add upstream https://github.com/nrclaudio/stereosegger.git
          
          # Fetch and merge
          git fetch upstream main
          git checkout main
          
          # Merge changes from public repo. 
          # --allow-unrelated-histories is included just in case the initial mirror/clone setup was complex.
          git merge upstream/main --allow-unrelated-histories -m "chore: sync with public upstream"
          
          # Push back to private repo
          git push origin main
